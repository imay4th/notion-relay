<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>更新</title>
<style>
  :root { --bg: #ffffff; --fg: #37352f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #191919; --fg: #d4d4d4; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
  p { padding: 0 16px; text-align: center; }
  a { color: inherit; display: block; margin-top: 8px; }
</style>
</head>
<body>
<p id="m">送信中…</p>
<script>
  // Notion の「更新」リンクから開かれる。合図を ntfy に送り、すぐ Notion のそのページへ戻す。
  // 例: ?p=<ハイフンなしのページID>   戻り先を試すとき: &back=web（既定は app）
  // 宛先: t なし＝調べ物（既存リンクとの互換のため既定）、t=artifact＝Artifact (from AI)、t=news＝News収集、
  //       t=book＝読書メモの書籍情報更新、t=reading＝読書メモのコメント（読書メモは p に DB のIDが来ることがある）
  // 知らない t は送らない（宛先を URL で自由に指定させない）
  const TOPICS = {
    "": "shirabemono-7520456a89d244789cf0d3ac",
    "artifact": "notion-artifact-efa5eb9227f44e188526813f",
    "news": "news-e36a5664875c59628ffbfba6",
    "book": "book-c1c922c6a2774b108855be02",
    "reading": "reading-8e6ac26535b2431c9cf7a235",
  };
  const q = new URLSearchParams(location.search);
  const p = (q.get("p") || "").toLowerCase();
  const TOPIC = TOPICS[q.get("t") || ""];
  const m = document.getElementById("m");
  if (!/^[0-9a-f]{32}$/.test(p) || !TOPIC) {
    m.textContent = "リンクが正しくありません";
  } else {
    const back = q.get("back") === "web" ? "https://www.notion.so/" + p : "notion://www.notion.so/" + p;
    fetch("https://ntfy.sh/" + TOPIC + "/publish?message=page-" + p)
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        m.textContent = "受け付けました";
        const a = document.createElement("a");
        a.href = back;
        a.textContent = "Notion に戻る";
        m.appendChild(a);
        // 開いたタブをブラウザに残さない（2026-09-28 本人要望）。Notion へ切り替わって裏に回った時点で閉じる。
        // タイマーで閉じないのは、「別のアプリを開く」の確認で Allow を押す前に閉じると戻れなくなるため（Cancel なら表示が残り、上のリンクで戻れる）。
        // スクリプトが閉じられるのは履歴 1 件のタブだけ（HTML 仕様の script-closable）。location.replace なので履歴は増えない。閉じられないブラウザでは何も起きない
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") window.close();
        });
        location.replace(back);
      })
      .catch(() => { m.textContent = "送信できませんでした。もう一度押してください"; });
  }
</script>
</body>
</html>
